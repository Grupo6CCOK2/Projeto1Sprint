<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred Cabelereiro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/imagens/barbearia.png" type="image/x-icon">
</head>

<body>
    <div class="modal">
        <div class="img"></div>
        <div class="formulario">
            <div class="titulo">
                <span><img width="20px" style="margin-bottom: -3px;" src="/imagens/barbearia.png" alt="">FRED'S CABELEREIRO<img width="20px" style="margin-bottom: -3px;" src="/imagens/barbearia.png" alt=""></span>
                <h1>Cadastre-se</h1>
                <p>Para fazer seu agendamento, faça seu cadastro:</p>
            </div>
            <div class="inputs">
                <div class="box">
                    <span>Primeiro nome:</span>
                    <input type="text" placeholder="Ex: Fred"><br>
                    <span>Email:</span>
                    <input type="email" placeholder="Ex: fred@exemplo.com"><br>
                    <span>Telefone:</span>
                    <input type="tel" placeholder="Ex: 11999999999"><br>
                </div>

                <div class="box">
                    <span>Sobrenome:</span>
                    <input type="text" placeholder="Ex: Mercury"><br>
                    <span>Senha:</span>
                    <input type="password" placeholder="*****"><br>
                    <span>Tem dependentes: (Filhos)</span>
                    <select name="" id="">
                        <option value="sim">Sim</option>
                        <option value="nao">Não</option>
                    </select>
                </div>
            </div>
            <div class="botao">
                <button>Cadastrar</button>
            </div>
        </div>
    </div>
</body>

</html>
